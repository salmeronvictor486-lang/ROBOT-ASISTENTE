[package]
name = "tico"
version = "0.1.0"
description = "Isla dinámica de escritorio con Tico, un robot asistente"
authors = ["Victor Salmerón"]
license = "MIT"
edition = "2021"
rust-version = "1.80"

[lib]
# El sufijo _lib evita el choque de nombres entre la librería y el binario en Windows.
name = "tico_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
tauri = { version = "2.12", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
