name: Instaladores

# Genera los .exe de Windows (NSIS) y el .dmg (macOS universal: Intel y Apple Silicon).
# Windows: x64 para equipos de 64 bits; x86 (32 bits) para Windows de 32 bits y para
# Windows 10 en ARM, que no ejecuta programas x64 pero sí de 32 bits.
# - A mano: pestaña Actions → "Instaladores" → Run workflow. Los archivos quedan en "Artifacts".
# - Con una etiqueta v* (p. ej. v0.1.0): además crea un borrador de Release con los instaladores.

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows 64 bits (.exe)
            os: windows-latest
            rust-targets: ""
            args: --bundles nsis
            files: src-tauri/target/release/bundle/nsis/*.exe
            artifact: Tico-Windows-64bits
          - name: Windows 32 bits y ARM (.exe)
            os: windows-latest
            rust-targets: i686-pc-windows-msvc
            args: --target i686-pc-windows-msvc --bundles nsis
            files: src-tauri/target/i686-pc-windows-msvc/release/bundle/nsis/*.exe
            artifact: Tico-Windows-32bits
          - name: macOS (.dmg)
            os: macos-latest
            rust-targets: aarch64-apple-darwin,x86_64-apple-darwin
            args: --target universal-apple-darwin --bundles app,dmg
            files: src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
            artifact: Tico-macOS
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: release-${{ matrix.artifact }}

      - name: Instalar dependencias
        run: npm ci

      - name: Compilar el instalador
        run: npm run tauri build -- ${{ matrix.args }}

      - name: Subir como artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.files }}
          if-no-files-found: error

      - name: Añadir al borrador de Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: ${{ matrix.files }}
