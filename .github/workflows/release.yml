name: Instaladores

# Genera los instaladores y los publica en una Release de GitHub con nombres fijos,
# para que los enlaces del README (releases/latest/download/...) descarguen siempre
# la última versión con un solo clic.
#
# Windows: x64 para equipos de 64 bits; x86 (32 bits) para Windows de 32 bits y para
# Windows 10 en ARM, que no ejecuta programas x64 pero sí de 32 bits. Cada uno en
# instalador (.exe) y en versión portable (.zip, sin instalar).
# macOS: .dmg universal (Intel y Apple Silicon).
#
# Se lanza a mano (Actions → Instaladores → Run workflow) o con una etiqueta v*.
# La Release se llama como la versión de package.json (p. ej. v0.1.0): si ya existe,
# se sustituyen sus archivos.

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows 64 bits
            os: windows-latest
            rust-targets: ""
            args: --bundles nsis
            out-dir: src-tauri/target/release
            arch: x64
            artifact: Tico-Windows-64bits
          - name: Windows 32 bits y ARM
            os: windows-latest
            rust-targets: i686-pc-windows-msvc
            args: --target i686-pc-windows-msvc --bundles nsis
            out-dir: src-tauri/target/i686-pc-windows-msvc/release
            arch: x86
            artifact: Tico-Windows-32bits
          - name: macOS
            os: macos-latest
            rust-targets: aarch64-apple-darwin,x86_64-apple-darwin
            args: --target universal-apple-darwin --bundles app,dmg
            out-dir: src-tauri/target/universal-apple-darwin/release
            arch: universal
            artifact: Tico-macOS
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: release-${{ matrix.artifact }}

      - name: Instalar dependencias
        run: npm ci

      # Firma y notarización de Apple: solo si existen los secrets (requiere la cuenta de
      # Apple Developer, 99 $/año). Sin ellos, el .dmg sale firmado "ad hoc" y macOS
      # avisa al abrirlo. Ver "Firmar la app de macOS" en el README.
      - name: Preparar la firma de Apple (si hay secrets)
        if: runner.os == 'macOS'
        shell: bash
        env:
          CERT: ${{ secrets.APPLE_CERTIFICATE }}
          CERT_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ -z "$CERT" ]; then
            echo "Sin certificado de Apple: el .dmg se firma ad hoc (macOS avisará al abrirlo)."
            exit 0
          fi
          {
            echo "APPLE_CERTIFICATE=$CERT"
            echo "APPLE_CERTIFICATE_PASSWORD=$CERT_PASSWORD"
            echo "APPLE_SIGNING_IDENTITY=$IDENTITY"
          } >> "$GITHUB_ENV"
          if [ -n "$APPLE_ID" ]; then
            {
              echo "APPLE_ID=$APPLE_ID"
              echo "APPLE_PASSWORD=$APPLE_PASSWORD"
              echo "APPLE_TEAM_ID=$TEAM_ID"
            } >> "$GITHUB_ENV"
          fi
          echo "Se firmará con Developer ID y se notarizará con Apple."

      - name: Compilar el instalador
        run: npm run tauri build -- ${{ matrix.args }}

      # Nombres sin número de versión: así el enlace del README nunca cambia.
      - name: Preparar los archivos con nombre fijo
        shell: bash
        run: |
          mkdir -p out
          dir="${{ matrix.out-dir }}"
          if [ "$RUNNER_OS" = "Windows" ]; then
            cp "$dir"/bundle/nsis/*.exe "out/Tico-Windows-${{ matrix.arch }}-setup.exe"
            mkdir -p portable
            cp "$dir/tico.exe" portable/Tico.exe
            (cd portable && 7z a -tzip "../out/Tico-Windows-${{ matrix.arch }}-portable.zip" Tico.exe)
          else
            cp "$dir"/bundle/dmg/*.dmg out/Tico-macOS.dmg
          fi
          ls -la out

      - name: Subir como artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: out/*
          if-no-files-found: error

  publish:
    name: Publicar la Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Leer la versión
        id: version
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true

      - name: Publicar
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: Tico ${{ steps.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          fail_on_unmatched_files: true
          files: out/*
          body: |
            ## Descargas

            | Sistema | Instalador | Portable (sin instalar) |
            | ------- | ---------- | ----------------------- |
            | Windows 64 bits (Intel/AMD) | `Tico-Windows-x64-setup.exe` | `Tico-Windows-x64-portable.zip` |
            | Windows 32 bits o Windows 10 ARM | `Tico-Windows-x86-setup.exe` | `Tico-Windows-x86-portable.zip` |
            | macOS (Intel y Apple Silicon) | `Tico-macOS.dmg` | — |

            La app no está firmada: Windows (SmartScreen) y macOS (Gatekeeper) avisarán la
            primera vez. En el README están los pasos para abrirla.
